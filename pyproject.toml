[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-ppt"
dynamic = ["version"]
description = "Export Manim animations as native, editable PowerPoint slides animated with Morph. No video."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Udbhav Ram" }]
requires-python = ">=3.10"
dependencies = [
    "manim>=0.19",
    "python-pptx>=1.0",
    "numpy",
    "lxml",
    "pillow",
]
keywords = ["manim", "powerpoint", "pptx", "slides", "morph", "animation", "presentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
manim-ppt = "manim_ppt.cli:main"

[project.urls]
Homepage = "https://github.com/udiram/manim-ppt"
Repository = "https://github.com/udiram/manim-ppt"
Issues = "https://github.com/udiram/manim-ppt/issues"
Changelog = "https://github.com/udiram/manim-ppt/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "manim_ppt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["manim_ppt"]

[tool.hatch.build.targets.sdist]
include = ["manim_ppt", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # the formatter owns line length; long XML fragments are fine
    "RUF001", # typographic characters in strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["F403", "F405"]  # `from manim import *` is the manim idiom
"tests/*" = ["B011"]
